# @package _global_

defaults:
  - /dataset@_group_.dl3dv: dl3dv_360
  - override /model/encoder: trisplat
  - override /model/encoder/backbone: vggt_omega
  - override /model/decoder: triangle_splatting_cuda
  - override /loss: [mse, lpips, pose, normal_teacher]

wandb:
  name: dl3dv_vggt_omega_triangle_224x448
  tags: [dl3dv, 224x448, triangle, vggt_omega, feature_only]

model:
  encoder:
    name: trisplat
    pose_free: true
    pretrained_weights: ""
    gaussians_per_axis: 16
    upscale_token_ratio: 2
    use_checkpoint: false
    use_triangle: true
    geometry_normal:
      refiner:
        arch: unet
        hidden_dim: 36
        num_blocks: 2
        num_scales: 4
        kernel_size: 3
    triangle_adapter:
      triangle_scale_min: 0.5
      triangle_scale_max: 18.0
      sh_degree: 0
      sigma_scale_initial: 1.0
      sigma_scale_final: 0.5
      sigma_warmup_steps: 8000
      coverage_scale_boost: 0.0
      coverage_opacity_threshold: 0.20

dataset:
  dl3dv:
    input_image_shape: [224, 448]
    original_image_shape: [270, 480]
    pose_norm_method: max_pairwise_d
    view_sampler:
      num_context_views: 24

optimizer:
  lr: 2e-4
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.01

data_loader:
  train:
    batch_size: 1

train:
  use_mono_normal_teacher: true

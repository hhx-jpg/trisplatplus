# @package _global_

defaults:
  - /dataset@_group_.dl3dv: dl3dv_360
  - override /model/encoder: da3_tsdpt
  - override /model/decoder: triangle_splatting_cuda
  - override /loss: [mse, lpips]

wandb:
  name: tsdpt_da3_dl3dv_5k_directdiff
  tags: [dl3dv, da3, tsdpt, triangle, direct-difference]

model:
  encoder:
    name: da3_tsdpt
    checkpoint: ${oc.env:DA3_CHECKPOINT,../Depth-Anything-3/checkpoints/DA3-GIANT-1.1}
    # Dimensionless factors with the native TriSplat depth/pixel-angle
    # parameterization. Point-map differentials provide orientation only.
    # Start with the existing wide range for coverage, then shrink the upper
    # bound toward the native DL3DV range as geometry stabilizes.
    triangle_scale_min: 1.0
    triangle_scale_max: 18.0
    triangle_scale_max_start: 18.0
    triangle_scale_max_end: 9.0
    triangle_scale_max_schedule_steps: 5000
    triangle_scale_init_fraction: 0.25
    max_triangle_edge_px: 0.0
    sigma_scale_initial: 4.6
    sigma_scale_final: 4.6
    sigma_warmup_steps: 1
    opacity_global_scale: 0.62
    smooth_kernel: 1
    normal_smooth_kernel: 1
    normal_smooth_iterations: 0
  decoder:
    opacity_temp_initial: 1.0
    opacity_temp_final: 5.0
    opacity_temp_warmup_steps: 5000
    alpha_floor_min: 0.0
    alpha_floor_warmup_steps: 0

loss:
  mse:
    # Low-alpha target pixels are temporary coverage holes. Downweight their
    # RGB error so the scale schedule is not held wide by large-loss skips.
    black_hole_weight: 0.25
    black_hole_opacity_threshold: 0.05

dataset:
  dl3dv:
    input_image_shape: [224, 448]
    original_image_shape: [540, 960]
    pose_norm_method: max_pairwise_d
    view_sampler:
      warm_up_steps: 75000
      num_context_views: 6
      initial_min_distance_between_context_views: 15
      initial_max_distance_between_context_views: 30
      min_distance_between_context_views: 20
      max_distance_between_context_views: 50
      context_gap_warm_up_steps: 75000

optimizer:
  lr: 2.0e-4
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.01
  # TSDPT's opacity head is the only fast-moving output.  The legacy GS
  # outputs and sigma head use a conservative rate while the global lr stays
  # unchanged for compatibility with the native experiment.
  opacity_lr: 1.0e-4
  tsdpt_lr: 1.0e-6

data_loader:
  train:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
  val:
    num_workers: 0
    persistent_workers: false

trainer:
  max_steps: 5000
  val_check_interval: 500

train:
  train_ignore_large_loss_after_steps: 200
  # Use the native triangle-refiner thresholds, but activate them after the
  # first 200 steps so the observed post-200 loss spikes are skipped.
  train_ignore_large_loss: 0.2
  train_ignore_large_loss_mse: 0.06
  train_ignore_large_loss_pose: 1.0
  use_mono_normal_teacher: false
  normal_bootstrap:
    enabled: false

checkpointing:
  every_n_train_steps: 100
